# Pinned so every machine builds with the same Gradle.
#
# 8.11.1 because AGP 8.7.3 requires 8.9 or newer, and because Gradle only
# supports running on a JDK it has seen — 8.11 tops out at JDK 23. If you ever
# raise the AGP version in gradle/libs.versions.toml, raise this in the same
# commit; a mismatch there produces an error message that names neither.
#
# The wrapper JAR and the gradlew scripts are not committed here. Android
# Studio writes them the first time it opens this project, or you can generate
# them yourself with an installed Gradle:
#
#   gradle wrapper --gradle-version 8.11.1
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
