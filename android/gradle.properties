org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where this build points.
#
# Not secrets. The anon key is published by design — it names the project and
# grants nothing on its own, because every policy in 002_rls.sql decides what a
# request may actually do. Assume it is extracted from the APK on day one,
# because it will be.
#
# They live here rather than in a committed file so that they follow a build
# rather than the repository. Copy `local.properties.example` to
# `local.properties` and put the real values there; Gradle merges that file in
# and it is gitignored.
#
# The key that *would* matter — the service role key — exists only in the edge
# function environment and appears in no app target on either platform.
SUPABASE_URL=https://your-project.supabase.co
SUPABASE_ANON_KEY=your-anon-key
